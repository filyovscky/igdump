<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title>
<style>
:root {color-scheme:light dark;--bg:#fafafa;--fg:#111;--muted:#666;--line:#ddd;--accent:#c02e65}
* {box-sizing:border-box} body {margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
main {max-width:960px;margin:auto;padding:32px 24px 64px} h1 {font-size:26px;margin:0 0 12px} h2 {font-size:20px;margin:32px 0 12px}
p {line-height:1.5} .meta,.note {color:var(--muted)} nav {display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}
a {color:var(--accent);text-decoration:none} a:hover {text-decoration:underline} a:focus-visible {outline:2px solid currentColor;outline-offset:4px}
dl {display:flex;gap:32px;flex-wrap:wrap;border-block:1px solid var(--line);padding:20px 0} dt {color:var(--muted);font-size:14px} dd {margin:6px 0 0;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
table {width:100%;border-collapse:collapse} th,td {padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)} th {font-weight:600;color:var(--muted)} td:first-child {width:44px;color:var(--muted)} td:last-child {font-variant-numeric:tabular-nums} .tables {overflow-x:auto} .name {display:block;color:var(--muted);font-size:14px;margin-top:4px}
@media(prefers-color-scheme:dark) {:root {--bg:#121212;--fg:#e4e4e4;--muted:#aaa;--line:#333;--accent:#ff80ad}}
@media(max-width:600px) {main {padding:24px 16px} dl {gap:20px} th,td {padding:10px 6px}}
</style>
<main>
<h1>$title</h1>
<p class="meta">$date · $range</p>
<p class="note">$coverage</p>
$issues
<nav><a href="$kind-stats.csv">All users · CSV</a><a href="$kind.csv">Collected records · CSV</a>$extra_link</nav>
<dl><div><dt>Collected $label</dt><dd>$total</dd></div><div><dt>Unique users</dt><dd>$users</dd></div><div><dt>Selected posts</dt><dd>$posts</dd></div></dl>
<h2>$users_title</h2>
<div class="tables"><table><thead><tr><th>#</th><th>User</th><th>$label</th>$user_extra_head</tr></thead><tbody>$user_rows</tbody></table></div>
<h2>$posts_title</h2>
<p class="note">$ranking_note</p>
<div class="tables"><table><thead><tr><th>#</th><th>Post</th><th>$label</th>$post_extra_head</tr></thead><tbody>$post_rows</tbody></table></div>
</main>
</html>
