<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$title</title>
<style>body{margin:0;background:#fafafa;color:#202020;font:16px system-ui,sans-serif}main{max-width:1100px;margin:32px auto;padding:0 24px 48px}h1{font-size:26px}h2{font-size:21px;display:flex;align-items:center;gap:14px}nav{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}a{color:#bd3163}section{padding:20px 0;border-top:1px solid #ddd}.cover{width:64px;height:64px;border-radius:50%;object-fit:cover}.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}figure{margin:0;min-width:0}figure img,figure video{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#151515}figcaption{font-size:13px;padding:8px 0;overflow-wrap:anywhere}li{overflow-wrap:anywhere}@media(max-width:600px){main{padding:0 16px}.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<main><h1>$title</h1><p>$status. Saved media stays available offline. Video covers are saved unless --download-videos is enabled. Album dates are publication times with UTC offsets.</p><nav>$reports</nav><nav aria-label="Highlight albums">$navigation</nav>$content</main></html>
