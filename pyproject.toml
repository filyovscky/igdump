[project]
name = "igdump"
version = "0.7.0"
description = "Export Instagram posts to a static HTML feed with local media"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "requests>=2.33.0",
    "rich>=13.7",
]

[project.scripts]
igdump = "insta_html_export:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["insta_html_export", "igdump_storage", "igdump_dates", "igdump_progress", "igdump_csv", "igdump_insights", "igdump_summary", "igdump_highlights"]
packages = ["igdump_assets"]

[tool.setuptools.package-data]
igdump_assets = ["*.html", "*.js", "*.css", "*.json", "*.txt"]
